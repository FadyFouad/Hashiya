name: CI

# Android. Changes that touch only the iOS app skip it; ios.yml covers those.
on:
  push:
    branches-ignore: ['record-screenshots/**', 'record-snapshots-ios/**']
    paths-ignore: ['ios/**', '.github/workflows/ios.yml', '.github/workflows/ios-record-snapshots.yml']
  pull_request:
    paths-ignore: ['ios/**', '.github/workflows/ios.yml', '.github/workflows/ios-record-snapshots.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check, build and test (screenshots verified against the Linux baselines)
        run: >-
          ./gradlew spotlessCheck assembleDebug testDebugUnitTest :core:model:test :core:bibtex:test lintDebug
          -Proborazzi.test.verify=true --continue
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: "android/**/build/outputs/roborazzi"
          if-no-files-found: ignore
