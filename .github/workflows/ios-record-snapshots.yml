name: iOS snapshot baselines

# A push to record-snapshots-ios/<anything> records every iOS snapshot on this pinned runner, Xcode 26.3
# and the iOS 26.2 and iOS 18.5 simulators (the source of truth). ios/scripts/record-snapshots-on-ci.sh
# drives it and copies the result into the checkout.
on:
  push:
    branches: ['record-snapshots-ios/**']

jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Record snapshots (recording fails the tests by design)
        env:
          TEST_RUNNER_SNAPSHOT_RECORD: "1"
        run: |
          # Test failures are expected while recording, so the exit code is ignored; the log and the
          # recorded image count decide instead.
          set +e
          xcodebuild test -project ios/Hashiya.xcodeproj -scheme Hashiya \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.2' \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -collect-test-diagnostics never \
            -only-testing:HashiyaSnapshotTests 2>&1 | tee xcodebuild.log
          set -e
          if grep -qE '\*\* BUILD FAILED \*\*' xcodebuild.log; then
            echo "::error::xcodebuild reported BUILD FAILED"
            exit 1
          fi
          if grep -qE '\.swift:[0-9]+:[0-9]+: error:' xcodebuild.log; then
            echo "::error::compile errors in the xcodebuild output"
            grep -E '\.swift:[0-9]+:[0-9]+: error:' xcodebuild.log
            exit 1
          fi
          for os in iOS26 iOS18; do
            count=$(find ios/HashiyaSnapshotTests/__Snapshots__/$os -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
            echo "Recorded $count $os baseline images"
            if [ "$count" -eq 0 ]; then
              echo "::error::no $os snapshot baselines were recorded"
              exit 1
            fi
          done
      - name: Pack the baselines with their paths
        run: find ios -path '*/__Snapshots__/*' -type f -name '*.png' | tar -cf ios-snapshot-baselines.tar -T -
      - uses: actions/upload-artifact@v7
        with:
          name: ios-snapshot-baselines
          path: ios-snapshot-baselines.tar
