name: iOS

on:
  push:
    branches-ignore: ['record-snapshots-ios/**']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Check the pinned simulator runtimes exist
        run: |
          xcrun simctl list runtimes | grep -q 'iOS 26.2' || { echo "::error::no iOS 26.2 runtime"; exit 1; }
          xcrun simctl list runtimes | grep -q 'iOS 18.5' || { echo "::error::no iOS 18.5 runtime"; exit 1; }
      - name: Check Arabic translations
        run: python3 ios/scripts/check-translations.py
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Unit and snapshot tests on iOS 26 (no API key, no live network)
        env:
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-diffs/ios26
        run: >-
          xcodebuild test -project ios/Hashiya.xcodeproj -scheme Hashiya
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.2'
          -skip-testing:HashiyaUITests
          -collect-test-diagnostics never
      - name: Unit and snapshot tests on iOS 18 (no API key, no live network)
        env:
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-diffs/ios18
        run: >-
          xcodebuild test -project ios/Hashiya.xcodeproj -scheme Hashiya
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          -skip-testing:HashiyaUITests
          -collect-test-diagnostics never
      # The snapshot suites ran inside the app, which the UI tests launch fresh; start them from clean simulators.
      - name: Reset the simulators
        run: |
          xcrun simctl shutdown all
          xcrun simctl erase all
      # One booted simulator at a time. With both up (one xcodebuild run boots every destination, even when testing
      # them in turn), the system share sheet and Files picker, which run in their own processes and start cold after
      # the erase, stayed blank for minutes on the runner's few cores.
      - name: UI tests on iOS 26
        id: ui26
        run: >-
          xcodebuild test -project ios/Hashiya.xcodeproj -scheme Hashiya
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.2'
          -only-testing:HashiyaUITests
          -collect-test-diagnostics never
          -resultBundlePath ${{ runner.temp }}/ui-tests-ios26.xcresult
      # Runs after an iOS 26 failure too, so one run reports both.
      - name: UI tests on iOS 18
        if: ${{ !cancelled() && steps.ui26.outcome != 'skipped' }}
        run: |
          xcrun simctl shutdown all
          xcodebuild test -project ios/Hashiya.xcodeproj -scheme Hashiya \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -only-testing:HashiyaUITests \
            -collect-test-diagnostics never \
            -resultBundlePath ${{ runner.temp }}/ui-tests-ios18.xcresult
      # The step's log names a failing UI test but not the line or the screen; the result bundles have both.
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-results
          path: |
            ${{ runner.temp }}/ui-tests-ios26.xcresult
            ${{ runner.temp }}/ui-tests-ios18.xcresult
          if-no-files-found: ignore
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-snapshot-diffs
          path: ${{ runner.temp }}/snapshot-diffs
          if-no-files-found: ignore
