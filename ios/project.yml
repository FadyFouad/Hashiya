name: Hashiya
options:
  bundleIdPrefix: com.etatech
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
packages:
  HashiyaKit:
    path: HashiyaKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
targets:
  Hashiya:
    type: application
    platform: iOS
    sources:
      - Hashiya
      - Shared
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.etatech.hashiya
        INFOPLIST_FILE: Hashiya/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Hashiya/Hashiya.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Crashlytics' upload script reads the package checkout.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: HashiyaKit
        products:
          - HashiyaData
          - HashiyaDesignSystem
          - HashiyaDiagnostics
          - HashiyaModel
          # UITestingStubs' PDF downloader implements its `PdfDownloading`.
          - HashiyaNetwork
          - FeatureSearch
          - FeatureLibrary
          - FeaturePaperDetails
          - FeatureReader
          - FeatureSettings
      - target: HashiyaShare
    postBuildScripts:
      - name: Upload Crashlytics symbols (Release)
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
  HashiyaShare:
    type: app-extension
    platform: iOS
    sources:
      - HashiyaShare
      - Shared
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.etatech.hashiya.share
        INFOPLIST_FILE: HashiyaShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: HashiyaShare/HashiyaShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - package: HashiyaKit
        products:
          - FeatureSearch
          - HashiyaData
          - HashiyaDesignSystem
          - HashiyaModel
  HashiyaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HashiyaUITests
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.etatech.hashiya.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hashiya
  HashiyaSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HashiyaSnapshotTests
        excludes:
          - "__Snapshots__/**"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.etatech.hashiya.snapshottests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Hashiya
      - package: HashiyaKit
        products:
          - HashiyaTesting
          - HashiyaData
          - HashiyaDesignSystem
          - HashiyaModel
          - FeatureSearch
          - FeatureLibrary
          - FeaturePaperDetails
          - FeatureReader
          - FeatureSettings
schemes:
  Hashiya:
    build:
      targets:
        Hashiya: all
        HashiyaSnapshotTests: [test]
        HashiyaUITests: [test]
    test:
      environmentVariables:
        # HashiyaSnapshotTests links the package products that its host app links, so Xcode builds them as dynamic
        # frameworks, and a framework built from a package target doesn't carry that target's resource bundle. The
        # unhosted package test bundles would then crash in `Bundle.module`; this points it at the built bundles.
        PACKAGE_RESOURCE_BUNDLE_PATH: $(BUILT_PRODUCTS_DIR)
      targets:
        - package: HashiyaKit/HashiyaModelTests
        - package: HashiyaKit/HashiyaDiagnosticsTests
        - package: HashiyaKit/HashiyaBibTeXTests
        - package: HashiyaKit/HashiyaCitationTests
        - package: HashiyaKit/HashiyaNetworkTests
        - package: HashiyaKit/HashiyaDatabaseTests
        - package: HashiyaKit/HashiyaDataTests
        - package: HashiyaKit/HashiyaDesignSystemTests
        - package: HashiyaKit/FeatureSearchTests
        - package: HashiyaKit/FeatureLibraryTests
        - package: HashiyaKit/FeaturePaperDetailsTests
        - package: HashiyaKit/FeatureReaderTests
        - package: HashiyaKit/FeatureSettingsTests
        - name: HashiyaSnapshotTests
          parallelizable: false
        - HashiyaUITests
